# Netlify config for the MoBros docs site.
#
# This project is deployed from its own repo (jmcancode/mobros_docs), so the
# Netlify site's *Base directory* is empty and every path below is relative to
# the repo root. If it's ever moved back inside the mobros monorepo, set Base
# directory to `web/docs-site` and these paths keep working unchanged.
#
# Access is handled in the browser by src/theme/Root — Google sign-in plus an
# admin check against the same Firestore user record the dashboard reads. There
# is deliberately no edge function: it would run on every asset request and
# meter accordingly. See docs/developers/deploying.md for what that trade buys
# and costs.

[build]
  command = "npm run build"
  publish = "build"

[build.environment]
  # Docusaurus 3 requires Node 20+. Pinning it means a Netlify default bump
  # can't break the build without us choosing to.
  NODE_VERSION = "20"
  NPM_FLAGS = "--prefer-offline --no-audit --no-fund"

[context.deploy-preview]
  command = "npm run build"

[context.branch-deploy]
  command = "npm run build"

# ── Headers ────────────────────────────────────────────────────────────────
# The page shells are near-empty — the gate renders client-side, so the content
# arrives with the JS. Assets are fingerprinted and safe to cache hard; the
# shells must not be, or a deploy won't reach anyone.

[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/img/*"
  [headers.values]
    Cache-Control = "public, max-age=604800"

[[headers]]
  for = "/*.html"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

[[headers]]
  for = "/"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "camera=(), microphone=(), geolocation=()"
    # Keep the site out of search results. Belt and braces with the meta tag
    # Docusaurus emits from `noIndex: true`.
    X-Robots-Tag = "noindex, nofollow, noarchive"

# ── Redirects ──────────────────────────────────────────────────────────────
# Deliberately NO SPA catch-all. Docusaurus emits a real HTML file per route,
# so a 404 should stay a 404 rather than silently rendering the homepage.
#
# Old paths from before `routeBasePath: '/'` was set:
[[redirects]]
  from = "/docs/*"
  to = "/:splat"
  status = 301
  force = false
