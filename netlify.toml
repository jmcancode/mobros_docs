# Netlify config for the MoBros docs site.
#
# The repo is a monorepo, so the Netlify site's *Base directory* must be set to
# `web/docs-site` in the UI. Netlify then reads this file from that directory
# and every path below is relative to it.
#
# This site is PRIVATE. `netlify/edge-functions/gate.ts` runs on every request
# and refuses anything without a valid staff session — see that file's header
# for the required environment variables, and docs/developers/deploying.md for
# the full setup.

[build]
  command = "npm run build"
  publish = "build"

[build.environment]
  # Docusaurus 3 requires Node 20+. Pinning it means a Netlify default bump
  # can't break the build without us choosing to.
  NODE_VERSION = "20"
  NPM_FLAGS = "--prefer-offline --no-audit --no-fund"

# Deploy previews and branch builds run the same build — and, importantly, the
# same gate. A preview URL is not a way around the sign-in wall.
[context.deploy-preview]
  command = "npm run build"

[context.branch-deploy]
  command = "npm run build"

# ── Headers ────────────────────────────────────────────────────────────────
# Cache-Control is deliberately NOT set here. The edge function owns it, and
# marks every gated response `private` so a signed-in reader's content can't be
# served from a shared cache to someone without a session. Setting a public
# cache header here would be overridden anyway, and would read as if this site
# were still public.

[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "camera=(), microphone=(), geolocation=()"
    # Belt and braces alongside the meta tag and the edge function's header.
    X-Robots-Tag = "noindex, nofollow, noarchive"

# ── Redirects ──────────────────────────────────────────────────────────────
# Deliberately NO SPA catch-all. Docusaurus emits a real HTML file per route,
# so a 404 should stay a 404 rather than silently rendering the homepage.
#
# Old paths from before `routeBasePath: '/'` was set:
[[redirects]]
  from = "/docs/*"
  to = "/:splat"
  status = 301
  force = false
